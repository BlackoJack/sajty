# Сборка и публикация на GitLab Pages.
#
# Адрес сайта и подпапка берутся из CI_PAGES_URL, поэтому конфиг
# одинаково работает и для project pages (group.gitlab.io/project),
# и для user pages (user.gitlab.io).

stages:
  - build
  - deploy

default:
  image: node:22-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

build:
  stage: build
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - |
      SITE_URL=$(node -e "console.log(new URL(process.env.CI_PAGES_URL).origin)")
      BASE_PATH=$(node -e "const p=new URL(process.env.CI_PAGES_URL).pathname.replace(/\/$/,''); console.log(p || '/')")
      echo "Собираю для $SITE_URL, base=$BASE_PATH"
      SITE_URL="$SITE_URL" BASE_PATH="$BASE_PATH" npm run build
    - test -f dist/index.html
  artifacts:
    paths:
      - dist
    expire_in: 1 week

pages:
  stage: deploy
  needs: [build]
  script:
    - rm -rf public
    - mv dist public
    - test -f public/index.html
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: production
    url: $CI_PAGES_URL
