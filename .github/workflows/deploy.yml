name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  github-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  publish-pages:
    needs: github-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  yandex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yandex-cloud" -n
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Configure Yandex Cloud
        env:
          YC_SA_JSON: ${{ secrets.YC_SA_JSON }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          YC_LEAD_KEY: ${{ secrets.YC_LEAD_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in YC_SA_JSON YC_FOLDER_ID YC_LEAD_KEY ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Нет секрета $name"
              missing=1
            fi
          done
          test "$missing" -eq 0
          umask 077
          printf '%s' "$YC_SA_JSON" > "$RUNNER_TEMP/sa.json"
          mkdir -p yandex
          printf '%s' "$YC_LEAD_KEY" > yandex/.lead-key
          printf '%s\n' \
            "TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}" \
            "TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}" \
            "ADMIN_PASSWORD=${ADMIN_PASSWORD}" > .env
          yc config set service-account-key "$RUNNER_TEMP/sa.json"
          yc config set folder-id "$YC_FOLDER_ID"

      - name: Deploy to Yandex
        run: bash scripts/deploy-yandex.sh
