name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  github-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  publish-pages:
    needs: github-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  yandex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yandex-cloud" -n
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Configure Yandex Cloud
        env:
          YC_SA_JSON: ${{ secrets.YC_SA_JSON }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          YC_LEAD_KEY: ${{ secrets.YC_LEAD_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in YC_SA_JSON YC_FOLDER_ID YC_LEAD_KEY ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Нет секрета $name"
              missing=1
            fi
          done
          test "$missing" -eq 0
          umask 077
          printf '%s' "$YC_SA_JSON" > "$RUNNER_TEMP/sa.json"
          mkdir -p yandex
          printf '%s' "$YC_LEAD_KEY" > yandex/.lead-key
          printf '%s\n' \
            "TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}" \
            "TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}" \
            "ADMIN_PASSWORD=${ADMIN_PASSWORD}" > .env
          yc config set service-account-key "$RUNNER_TEMP/sa.json"
          yc config set folder-id "$YC_FOLDER_ID"

      - name: Deploy to Yandex
        env:
          PUBLIC_SITE_URL: https://sitly.ru
          PUBLIC_YANDEX_METRIKA_ID: ${{ secrets.PUBLIC_YANDEX_METRIKA_ID }}
          PUBLIC_YANDEX_VERIFICATION: ${{ secrets.PUBLIC_YANDEX_VERIFICATION }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.PUBLIC_GOOGLE_SITE_VERIFICATION }}
          PUBLIC_INDEXNOW_KEY: ${{ secrets.PUBLIC_INDEXNOW_KEY }}
        run: bash scripts/deploy-yandex.sh

      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "CLOUDFLARE_API_TOKEN не задан — пропуск purge"
            exit 0
          fi
          bash scripts/cf-purge.sh sitly.ru

      - name: SEO ping
        env:
          PUBLIC_SITE_URL: https://sitly.ru
          PUBLIC_INDEXNOW_KEY: ${{ secrets.PUBLIC_INDEXNOW_KEY }}
        run: bash scripts/seo-ping.sh

  cloudflare-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/yc-proxy
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/yc-proxy/package-lock.json

      - name: Install and deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "Нет CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID — пропуск Worker"
            exit 0
          fi
          npm ci
          npx wrangler deploy
